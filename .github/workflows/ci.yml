name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: clqn-test
          POSTGRES_DB: clqn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:clqn-test@127.0.0.1:5432/clqn_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run package:cli
      - run: npm run test:package
      - if: matrix.node == 22
        run: bash scripts/publish-cli.test.sh
      - name: Save the tested CLI and Homebrew formula
        if: matrix.node == 22
        uses: actions/upload-artifact@v7
        with:
          name: cli-release
          path: |
            dist/clqn-cli-*.tgz
            dist/clqn.rb
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - run: node website/build.mjs
      - name: Save the static site
        if: matrix.node == 22 && github.repository == 'rli8145/clqn' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: website
          path: website/dist/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  deploy-website:
    needs: check
    if: github.repository == 'rli8145/clqn' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: website-production
      url: https://clqn.org/
    concurrency:
      group: clqn-website-production
      queue: max
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: website
          path: site
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --global vercel@64.7.0 --no-audit --no-fund
      - name: Check whether this commit still heads main
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"
          if [[ "$head_sha" != "$GITHUB_SHA" ]]; then
            echo "A newer commit is on main. Skipping deployment." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy the tested static files
        if: steps.main.outputs.sha == github.sha
        working-directory: site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_4eYNBUF6m5N5f08gV6fyFTvm
          VERCEL_PROJECT_ID: prj_nQHhgpFtSBG1jvhNtOUChN3X9vO6
        run: |
          : "${VERCEL_TOKEN:?Set VERCEL_TOKEN in the website-production GitHub environment}"
          vercel deploy --prod --yes --token "$VERCEL_TOKEN"
      - name: Check the public homepage, download, docs and logo
        if: steps.main.outputs.sha == github.sha
        working-directory: site
        run: |
          for file in index.html download.html docs/index.html assets/logo.svg groundhogs.svg; do
            route=${file%index.html}
            for attempt in 1 2 3 4; do
              if curl --fail --silent --show-error --location --max-time 20 \
                "https://clqn.org/$route" --output "$RUNNER_TEMP/live-response" &&
                cmp -s "$file" "$RUNNER_TEMP/live-response"; then
                break
              fi
              if [[ "$attempt" == 4 ]]; then
                echo "::error::The public response for /$route differs from $file or could not be fetched."
                exit 1
              fi
              sleep 3
            done
          done

  release-cli:
    needs: check
    if: github.repository == 'rli8145/clqn' && github.event_name == 'push' && github.event.created && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cli-release
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: clqn-cli-release
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the release tag and main ancestry
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$GITHUB_REF^{commit}")"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - uses: actions/download-artifact@v8
        with:
          name: cli-release
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Publish the verified archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-cli.sh
